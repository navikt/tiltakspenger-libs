[versions]
arrow = "2.2.3"
atomicfu = "0.33.0"
auth0-jwt = "4.5.2"
auth0-jwks = "0.24.1"
avro = "1.12.1"
# Avro-pluginen drar inn avro-tools på buildscript-classpathen. Oppføringen er forberedt for at build-logic skal eie pluginen; i dag deklarerer avro-repoene den selv.
avro-gradle-plugin = "0.0.12"
caffeine = "3.2.4"
# commons-lang3 kommer transitivt fra avro-tools på buildscript-classpathen, og pinnes mot ukontrollert rekursjon på lange inndata (GHSA-j288-q9x7-2f5v).
commons-lang3 = "3.18.0"
commons-text = "1.15.0"
confluent = "8.1.1"
cyclonedx-gradle-plugin = "3.3.0"
flyway = "12.11.0"
handlebars = "4.5.3"
hamcrest = "3.0"
hikaricp = "7.1.0"
jackson = "3.2.1"
jackson-annotations = "2.22"
# Jackson 2 brukes ikke direkte, men kommer transitivt via WireMock og java-jwt; bom-en løfter dem over de patchede versjonene (bl.a. GHSA-j3rv-43j4-c7qm).
jackson2 = "2.22.1"
# Jetty 11 er EOL og får ikke fiks for bl.a. GHSA-355h-qmc2-wpwf; jetty12-varianten av WireMock + denne bom-en gir patchet Jetty.
jetty = "12.0.37"
jetbrains-annotations = "26.1.0"
jsonassert = "1.5.3"
junit = "6.1.2"
kafka = "4.3.1"
konfig = "1.6.10.0"
konsist = "0.17.3"
kotest = "6.2.3"
kotest-extensions-wiremock = "3.1.0"
kotlin = "2.4.10"
kotlin-faker = "1.16.2"
ktlint = "1.8.0"
kover = "0.9.9"
kotlin-logging = "8.0.4"
kotlin-wiremock = "2.1.1"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"
kotliquery = "1.9.1"
# Låst til 3.4-linja på grunn av en alvorlig klientbug i 3.5.x - se ignore-blokken i .github/dependabot.yml.
ktor = "3.4.3"
logback = "1.5.38"
logback-syslog4j = "1.0.0"
logstash-logback-encoder = "9.0"
# LZ4 brukes ikke direkte, men kafka-clients drar inn 1.10.2, der de native XXHash-implementasjonene kan krasje JVM-en på ugyldige byte-intervaller (GHSA-xx22-p4ch-683r).
# Vi styrer derfor versjonen selv, på samme måte som netty- og scram-linjene under.
lz4 = "1.11.1"
micrometer = "1.17.0"
mockk = "1.14.11"
# Netty brukes ikke direkte, men er en hyppig kilde til sikkerhetshull; vi styrer derfor de transitive versjonene selv med bom-er per linje.
# 4.1-linja kommer fra r2dbc-postgresql 1.1.2 (nyeste), som drar inn sårbar 4.1.112 (bl.a. GHSA-c653-97m9-rcg9).
netty41 = "4.1.136.Final"
# 4.2-linja kommer fra ktor-server-netty 3.4.3, som drar inn sårbar 4.2.12 (bl.a. GHSA-x4gw-5cx5-pgmh).
netty42 = "4.2.16.Final"
nimbus-jose-jwt = "10.9.1"
ojdbc = "23.26.3.0.0"
pdfbox = "3.0.8"
postgresql = "42.7.13"
# Simpleclient er avviklet oppstrøms til fordel for micrometer; kun soknad-api bruker den, og linja fjernes når den er migrert.
prometheus-simpleclient = "0.16.0"
r2dbc-postgresql = "1.1.2.RELEASE"
# SCRAM brukes ikke direkte, men r2dbc-postgresql drar inn 3.2 med auth-nedgraderingssårbarhet (GHSA-p9jg-fcr6-3mhf, patchet i 3.3).
scram = "3.4"
slf4j = "2.0.18"
snakeyaml = "2.6"
spotless = "8.8.0"
swagger-parser = "2.1.45"
testcontainers = "2.0.5"
tika = "3.3.2"
tms-mikrofrontend-selector = "3.0.0"
tms-varsel = "2.2.0"
ulid = "1.6.0"
wiremock = "3.13.2"
xmlunit = "2.12.0"

